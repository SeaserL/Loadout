[package]
name = "loadout-desktop"
description = "Loadout desktop app: tray and management UI, an IPC client of loadoutd (ADR-002)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "loadout_desktop"
path = "src/lib.rs"

[[bin]]
name = "loadout-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
loadout-ipc.workspace = true
loadout-platform.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12", features = ["tray-icon", "custom-protocol"] }
tauri-plugin-single-instance = "2.5"
tokio.workspace = true

[lints]
workspace = true
