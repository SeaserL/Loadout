[package]
name = "loadout-fusion-desktop"
description = "Loadout Fusion window and tray: starts the isolated backend and opens its console."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "Loadout"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12", features = ["tray-icon", "custom-protocol"] }
tauri-plugin-single-instance = "2.5"

[lints]
workspace = true
