name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the version; rustup installs it on first use.
      - name: Toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The desktop crate embeds apps/desktop/dist at compile time (ExecPlan 005 §3.1).
      - name: Frontend
        run: |
          npm ci
          npm run build

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Bridge and update transaction contracts (offline)
        run: |
          python -m unittest discover -s scripts -p "test_opencode*.py"
          python -m unittest discover -s scripts -p "test_update_package.py"
          node --test scripts/opencode_controls.test.mjs scripts/workbuddy_bridge.test.mjs

      - name: Benchmarks compile
        run: cargo bench -p loadout-benchmarks --no-run

      - name: Third-party license policy
        run: python scripts/third_party_licenses.py --check
