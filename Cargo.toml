[workspace]
resolver = "3"
members = [
    "apps/desktop/src-tauri",
    "apps/loadout",
    "benchmarks",
    "crates/browser",
    "crates/core",
    "crates/gateway",
    "crates/ipc",
    "crates/platform",
    "crates/protocol",
    "crates/provider-sdk",
    "crates/providers",
    "crates/router",
    "crates/secrets",
    "crates/storage",
]

[workspace.package]
version = "0.3.0-demo.3"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/SeaserL/Loadout"
publish = false

[workspace.dependencies]
# Internal crates
loadout-browser = { path = "crates/browser" }
loadout-core = { path = "crates/core" }
loadout-gateway = { path = "crates/gateway" }
loadout-ipc = { path = "crates/ipc" }
loadout-platform = { path = "crates/platform" }
loadout-protocol = { path = "crates/protocol" }
loadout-provider-sdk = { path = "crates/provider-sdk" }
loadout-providers = { path = "crates/providers" }
loadout-router = { path = "crates/router" }
loadout-secrets = { path = "crates/secrets" }
loadout-storage = { path = "crates/storage" }

# Async / networking
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "io-util", "process", "fs"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
bytes = "1.12"
axum = "0.8"
reqwest = { version = "0.13", features = ["stream"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["limit", "request-id", "trace"] }

# Storage
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6"

# Platform
windows-sys = "0.61"

# Security
secrecy = "0.10"
sha2 = "0.11"
rand = "0.10"
# Already the TLS crypto provider; reused for the encrypted key export (ExecPlan 020).
aws-lc-rs = "1.18"
zeroize = "1.9"

# Serialization / utilities
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
uuid = { version = "1.26", features = ["v4", "serde"] }
arc-swap = "1.9"
thiserror = "2.0"
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

# Dev
tempfile = "3.27"
criterion = { version = "0.8", features = ["async_tokio"] }

[workspace.lints.rust]
unsafe_code = "deny"
# MSVC link.exe reports "Creating library …" for binaries that export symbols; not actionable.
linker_messages = "allow"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
